# Copie para radar.toml e ajuste. Todas as chaves são opcionais.
# radar.toml fica fora do git, então seus termos não são publicados.

[general]
# Contato (e-mail ou URL) enviado no User-Agent somente à Wikimedia, que dá limite
# maior a quem se identifica. As outras fontes nunca recebem esse dado.
contact = ""
data_dir = "data"
# Quantos picos de busca e de leitura de cada mercado viram candidatos por execução.
trends_per_market = 3
wiki_per_market = 3

# Mercados padrão: br (pt), us (en), mx (es). Desligue um com enabled = false
# ou acrescente outro informando todos os campos.
# [markets.mx]
# enabled = false
# [markets.pt]
# geo = "PT"
# lang = "pt"
# wiki = "pt.wikipedia"
# news_hl = "pt-PT"
# news_ceid = "PT:pt-150"

[youtube]
window_days = 30          # idade máxima dos vídeos analisados
pages = 1                 # páginas de busca por termo; cada uma custa 100 unidades
small_subs = 20000        # abaixo disso o canal conta como pequeno
new_days = 365            # mais novo que isso o canal conta como novo
breakout_views = 50000    # views mínimas de um "estouro"
breakout_ratio = 5.0      # e views divididas por inscritos
daily_quota = 10000       # cota diária do seu projeto no Google Cloud
reserve = 1000            # unidades que o radar nunca gasta
max_queries_per_run = 75  # cada termo medido custa cerca de 102 unidades
scan = true
retention_days = 30       # dados da API do YouTube são apagados depois disso

# Pesos do índice de oportunidade. São heurística, não foram validados.
[weights]
demand = 0.35
openness = 0.30
breakouts = 0.20
momentum = 0.15

# Sementes: territórios que o radar mede em toda execução, um termo por mercado.
# A grade abaixo é só um ponto de partida amplo, para comparar territórios com
# os mesmos critérios. Não é recomendação: troque, apague e acrescente à vontade.
# Use `python -m radar expand "termo"` para abrir um território em subnichos.

